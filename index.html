<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#083b47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="釣魚アルバム">
  <meta name="description" content="釣った魚を写真・名前・場所で記録するオフラインアルバム">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>釣魚アルバム</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#102d35;background:#f3f7f6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
    .top{background:linear-gradient(140deg,#063d4b,#147b83);color:white;padding:calc(env(safe-area-inset-top) + 32px) 20px 28px;border-radius:0 0 26px 26px}
    .shell{max-width:700px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.13em;opacity:.8;font-weight:700}.top h1{font-size:28px;letter-spacing:.03em;margin:8px 0 8px}.top p{font-size:13px;margin:0;opacity:.86}.overview{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.count{font-size:38px;font-weight:800;line-height:1}.count small{font-size:13px;margin-left:8px;font-weight:500;opacity:.8}
    .add{display:inline-flex;gap:6px;align-items:center;background:#fff;color:#07505b;border:0;border-radius:13px;padding:12px 17px;font-weight:800;box-shadow:0 3px 12px #002d3530}
    main{padding:24px 16px 45px;max-width:700px;margin:auto}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.bar h2{margin:0;font-size:19px}.subbutton{background:transparent;border:1px solid #d7e3e0;color:#39656a;padding:8px 10px;border-radius:9px;font-size:12px}
    .search{width:100%;border:1px solid #d9e5e1;border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:15px;font-size:15px;outline-color:#07858f}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.fish{background:#fff;border:1px solid #e1eae7;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #122b3210;text-align:left;padding:0;min-width:0;color:inherit}
    .photo{aspect-ratio:1.15;object-fit:cover;width:100%;display:block;background:#e4eeec}.placeholder{aspect-ratio:1.15;display:grid;place-items:center;background:linear-gradient(135deg,#d5eae7,#e4f3ee);font-size:52px}
    .fishbody{padding:13px}.fishname{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.where{font-size:12px;color:#66818a;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:45px 25px;text-align:center;color:#69838b;background:white;border:1px dashed #c6d8d5;border-radius:20px}.empty .illustration{font-size:60px;margin-bottom:13px}.empty h3{color:#284e57;margin:0 0 8px;font-size:17px}.empty p{font-size:13px;line-height:1.7;margin:0}
    dialog{border:0;padding:0;border-radius:20px;width:min(calc(100vw - 28px),500px);max-height:calc(100dvh - 30px);color:#153940;box-shadow:0 20px 65px #082b3d55}dialog::backdrop{background:#031e2bb5}.modal{padding:22px;overflow:auto;max-height:calc(100dvh - 30px)}.modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:19px}.modal h2{font-size:21px;margin:0}.close{border:0;background:#eef4f2;border-radius:50%;font-size:22px;width:35px;height:35px;color:#3e676b;display:grid;place-items:center}
    label.field{display:block;font-size:13px;font-weight:800;margin:0 0 15px}label.field input{display:block;border:1px solid #d0dedc;padding:13px;border-radius:11px;width:100%;margin-top:7px;font-size:16px;outline-color:#008a94}.filepick{display:flex;align-items:center;justify-content:center;border:2px dashed #a7c9c5;background:#f0f8f5;min-height:165px;border-radius:13px;overflow:hidden;position:relative;cursor:pointer;margin:7px 0 16px}.filepick img{width:100%;max-height:240px;object-fit:contain}.filepick .fileplaceholder{text-align:center;color:#41797e;font-size:13px;line-height:2}.filepick .fileplaceholder b{font-size:30px}.filepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
    .primary{width:100%;border:0;background:#087781;color:#fff;font-weight:800;padding:14px 18px;border-radius:12px;font-size:16px}.danger{border:0;background:#fff0ee;color:#b33a30;font-weight:700;border-radius:11px;padding:12px;margin-top:10px;width:100%}.secondary{background:#eef5f3;color:#1e666c;border:0;border-radius:11px;padding:12px;font-weight:700}.note{font-size:12px;line-height:1.65;color:#799198;margin:15px 0 0}.detailphoto{width:100%;max-height:45vh;object-fit:contain;border-radius:11px;background:#edf3f2}.detailtitle{font-size:23px;font-weight:800;margin:16px 0 10px;overflow-wrap:anywhere}.detaillocation{color:#557982;margin-bottom:23px;overflow-wrap:anywhere}.actions{display:flex;gap:10px}.actions button{flex:1}.utils{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:22px}.utils button{border:1px solid #cfdedb;background:white;color:#456c70;padding:9px 11px;border-radius:10px;font-size:12px}.status{font-size:12px;color:#607f83;margin:10px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:560px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <header class="top"><div class="shell"><div class="eyebrow">MY FISH COLLECTION</div><h1>🐟 釣魚アルバム</h1><p>釣った魚を、思い出といっしょに。</p><div class="overview"><div class="count"><span id="count">0</span><small>匹の記録</small></div><button class="add" id="addTop">＋ 記録する</button></div></div></header>
  <main><div class="bar"><h2>魚のコレクション</h2><button class="subbutton" id="sortBtn">新しい順 ↓</button></div><input class="search" id="search" type="search" placeholder="魚の名前・場所で検索" aria-label="魚の名前・場所で検索"><div id="gallery" class="gallery"></div><div id="empty" class="empty" hidden><div class="illustration">🎣</div><h3 id="emptyTitle">まだ魚の記録がありません</h3><p id="emptyText">「＋ 記録する」から最初の1匹を登録しよう。</p></div><section class="utils" aria-label="データ管理"><button id="exportBtn">記録をバックアップ</button><button id="importBtn">バックアップを復元</button><input id="importFile" class="sr-only" type="file" accept="application/json,.json"><button id="helpBtn">データ保存について</button></section><div class="status" id="status" role="status" aria-live="polite"></div></main>
  <dialog id="editDialog"><form id="fishForm" class="modal"><div class="modal-header"><h2 id="editHeading">魚を記録する</h2><button type="button" class="close" data-close="editDialog" aria-label="閉じる">×</button></div><label class="field">魚の名前 <input id="fishName" maxlength="70" required placeholder="例：ギンガメアジ" autocomplete="off"></label><label class="field">釣った場所 <input id="fishPlace" maxlength="130" required placeholder="例：那覇港、沖縄" autocomplete="off"></label><label class="field">写真 <span style="font-weight:400;color:#6c8990">（あとから変更できます）</span><div class="filepick" id="pickArea"><div class="fileplaceholder" id="picPlaceholder"><b>📷</b><br>タップして写真を選択</div><img id="preview" hidden alt="選択した写真のプレビュー"><input type="file" id="fishPhoto" accept="image/*" aria-label="魚の写真を選択"></div></label><button type="submit" class="primary" id="saveBtn">保存する</button><p class="note">写真や記録はこの端末内に保存され、外部に送信されません。</p></form></dialog>
  <dialog id="detailDialog"><div class="modal"><div class="modal-header"><h2>釣った魚</h2><button type="button" class="close" data-close="detailDialog" aria-label="閉じる">×</button></div><div id="detailImage"></div><div class="detailtitle" id="detailName"></div><div class="detaillocation" id="detailPlace"></div><div class="actions"><button class="secondary" id="editCurrent">編集する</button><button class="secondary" id="closeDetail">閉じる</button></div><button class="danger" id="deleteCurrent">この記録を削除する</button></div></dialog>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const dbName='fish-album-offline-v1', storeName='fish';
    let db, items=[], editingId=null, openedId=null, selectedPhoto=null, sortNewest=true, previewURL=null, renderedURLs=[];
    const escapeText=s=>String(s??'');
    const status=s=>{ $('status').textContent=s; };
    const getAll=()=>new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly');const req=tx.objectStore(storeName).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
    const put=item=>new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
    const del=id=>new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
    const uid=()=>globalThis.crypto?.randomUUID?.() ?? String(Date.now())+'-'+Math.random().toString(36).slice(2);
    const openDB=()=>new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('このブラウザは端末内保存に対応していません'));const req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(storeName))d.createObjectStore(storeName,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
    function revokeList(){renderedURLs.forEach(x=>URL.revokeObjectURL(x));renderedURLs=[];}
    function blobURL(blob, track=true){const url=URL.createObjectURL(blob);if(track)renderedURLs.push(url);return url;}
    function node(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=escapeText(text);return e;}
    function render(){revokeList();const q=$('search').value.trim().toLocaleLowerCase();let list=items.filter(x=>(x.name+' '+x.place).toLocaleLowerCase().includes(q)).sort((a,b)=>sortNewest?(b.createdAt-a.createdAt):(a.createdAt-b.createdAt));const gallery=$('gallery');gallery.replaceChildren();$('count').textContent=items.length;$('empty').hidden=list.length!==0;if(!list.length){$('emptyTitle').textContent=q?'該当する魚が見つかりません':'まだ魚の記録がありません';$('emptyText').textContent=q?'別のキーワードで検索してみてください。':'「＋ 記録する」から最初の1匹を登録しよう。';}
      const frag=document.createDocumentFragment();for(const fish of list){const card=node('button','fish');card.type='button';card.setAttribute('aria-label',fish.name+' / '+fish.place);if(fish.photo instanceof Blob){const img=node('img','photo');img.src=blobURL(fish.photo);img.alt=fish.name;img.loading='lazy';card.append(img);}else card.append(node('div','placeholder','🐠'));const body=node('div','fishbody');body.append(node('div','fishname',fish.name),node('div','where','📍 '+fish.place));card.append(body);card.addEventListener('click',()=>openDetail(fish.id));frag.append(card);}gallery.append(frag);
    }
    const refresh=async()=>{items=await getAll();render();};
    async function resizedImage(file){if(!file)return null;const MAX=1600,QUALITY=.82;try{const bm=await createImageBitmap(file);const scale=Math.min(1,MAX/Math.max(bm.width,bm.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bm.width*scale));canvas.height=Math.max(1,Math.round(bm.height*scale));canvas.getContext('2d').drawImage(bm,0,0,canvas.width,canvas.height);bm.close?.();return await new Promise((ok,bad)=>canvas.toBlob(b=>b?ok(b):bad(Error('写真を変換できませんでした')),'image/jpeg',QUALITY));}catch(e){if(file.type.startsWith('image/'))return file;throw e;}}
    function setPreview(blob){if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null;}$('preview').hidden=!blob;$('picPlaceholder').hidden=!!blob;if(blob){previewURL=blobURL(blob,false);$('preview').src=previewURL;}else $('preview').removeAttribute('src');}
    function openEdit(id=null){editingId=id;const fish=items.find(x=>x.id===id);$('editHeading').textContent=fish?'魚の記録を編集':'魚を記録する';$('fishName').value=fish?.name??'';$('fishPlace').value=fish?.place??'';$('fishPhoto').value='';selectedPhoto=fish?.photo??null;setPreview(selectedPhoto);$('saveBtn').disabled=false;$('saveBtn').textContent='保存する';$('editDialog').showModal();}
    function openDetail(id){const fish=items.find(x=>x.id===id);if(!fish)return;openedId=id;const imgBox=$('detailImage');imgBox.replaceChildren();if(fish.photo instanceof Blob){const img=node('img','detailphoto');img.src=blobURL(fish.photo);img.alt=fish.name;imgBox.append(img);}else imgBox.append(node('div','placeholder','🐠'));$('detailName').textContent=fish.name;$('detailPlace').textContent='📍 '+fish.place;$('detailDialog').showModal();}
    async function backup(){try{const data=[];for(const x of items){let photo=null;if(x.photo instanceof Blob){const base64=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(String(rd.result));rd.onerror=()=>reject(rd.error);rd.readAsDataURL(x.photo);});photo=base64;}data.push({id:x.id,name:x.name,place:x.place,createdAt:x.createdAt,photo});}const blob=new Blob([JSON.stringify({format:'fish-album-backup',version:1,exportedAt:new Date().toISOString(),fish:data})],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='釣魚アルバム-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status('バックアップを書き出しました。ファイルアプリに保存してください。');}catch(e){alert('書き出しに失敗しました: '+e.message);}}
    function dataURLtoBlob(url){const parts=url.split(',');if(parts.length!==2 || !/^data:image\//.test(parts[0]))throw Error('写真データが不正です');const type=parts[0].match(/^data:([^;,]+)/)?.[1]||'image/jpeg';const bytes=atob(parts[1]);const out=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)out[i]=bytes.charCodeAt(i);return new Blob([out],{type});}
    async function restore(file){try{const raw=await file.text();const parsed=JSON.parse(raw);if(parsed.format!=='fish-album-backup'||!Array.isArray(parsed.fish))throw Error('釣魚アルバムのバックアップではありません');if(parsed.fish.length>5000)throw Error('記録数が多すぎます');if(!confirm(parsed.fish.length+'件の記録を読み込みます。同じIDの記録は上書きされます。続けますか？'))return;for(const x of parsed.fish){if(typeof x.id!=='string'||typeof x.name!=='string'||typeof x.place!=='string'||!x.name.trim()||!x.place.trim())continue;const photo=typeof x.photo==='string'?dataURLtoBlob(x.photo):null;await put({id:x.id,name:x.name.slice(0,70),place:x.place.slice(0,130),createdAt:Number(x.createdAt)||Date.now(),photo});}await refresh();status('バックアップを復元しました。');}catch(e){alert('復元できませんでした: '+e.message);}finally{$('importFile').value='';}}
    async function boot(){try{db=await openDB();await refresh();status('オフラインで利用できます。');}catch(e){alert('端末への保存を開始できませんでした。Safariの通常タブで開いてください。\n'+e.message);$('addTop').disabled=true;}}
    $('addTop').addEventListener('click',()=>openEdit());$('sortBtn').addEventListener('click',()=>{sortNewest=!sortNewest;$('sortBtn').textContent=sortNewest?'新しい順 ↓':'古い順 ↑';render();});$('search').addEventListener('input',render);
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
    $('fishPhoto').addEventListener('change',async()=>{const f=$('fishPhoto').files?.[0];if(!f)return;try{selectedPhoto=await resizedImage(f);setPreview(selectedPhoto);}catch(e){alert('写真を読み込めませんでした: '+e.message);}});
    $('fishForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const name=$('fishName').value.trim(),place=$('fishPlace').value.trim();if(!name||!place)return;const original=items.find(x=>x.id===editingId);$('saveBtn').disabled=true;$('saveBtn').textContent='保存中…';try{await put({id:original?.id??uid(),name,place,photo:selectedPhoto,createdAt:original?.createdAt??Date.now()});$('editDialog').close();await refresh();status('記録を保存しました。');}catch(err){alert('保存できませんでした。端末の空き容量を確認してください。\n'+err.message);}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='保存する';}});
    $('editCurrent').addEventListener('click',()=>{const id=openedId;$('detailDialog').close();openEdit(id);});$('closeDetail').addEventListener('click',()=>$('detailDialog').close());
    $('deleteCurrent').addEventListener('click',async()=>{if(!confirm('この魚の記録を削除しますか？\n削除後は元に戻せません。'))return;try{await del(openedId);$('detailDialog').close();await refresh();status('記録を削除しました。');}catch(e){alert('削除に失敗しました: '+e.message);}});
    $('editDialog').addEventListener('close',()=>{if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null;}});
    $('exportBtn').addEventListener('click',backup);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',()=>{const file=$('importFile').files?.[0];if(file)restore(file);});
    $('helpBtn').addEventListener('click',()=>alert('記録と写真はこのiPhoneのブラウザ内に保存されます。インターネットへの送信はありません。\n\nSafariの閲覧履歴とWebサイトデータを削除したり、アプリを削除したりすると記録が消える場合があります。「記録をバックアップ」から定期的にファイルを保存してください。\n\n初回はインターネット接続中に開いてホーム画面へ追加してください。その後はオフラインで使えます。'));
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
    boot();
  })();
  </script>
</body>
</html>
